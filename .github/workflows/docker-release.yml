name: Docker Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v, for example 0.4.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/ravabl/gatling-community-mcp
  JAVA_VERSION: "25"
  DOCKERHUB_DESCRIPTION: Local MCP server for Gatling Community authoring.

jobs:
  acceptance:
    name: Rich MCP acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit and integration tests
        run: mvn -B test

      - name: Build shaded jar
        run: mvn -q -DskipTests package

      - name: Smoke-test shaded jar over stdio
        run: scripts/mcp-smoke.py --project-path "$PWD" -- java -jar target/gatling-community-mcp-0.4.0-all.jar

      - name: Build Docker image for acceptance
        run: docker build -t gatling-community-mcp:ci .

      - name: Smoke-test Docker image over stdio
        run: |
          scripts/mcp-smoke.py --project-path /workspace -- docker run --rm -i \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env GATLING_MCP_WORKSPACE_ROOTS=/workspace \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            gatling-community-mcp:ci

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: acceptance
    if: github.event_name != 'release' || github.event.release.prerelease == false
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected semantic version like 0.4.0, got: $version" >&2
            exit 1
          fi
          minor="${version%.*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Maven build
        run: mvn -B test package

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ secrets.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=MCP Gatling-community
            org.opencontainers.image.description=${{ env.DOCKERHUB_DESCRIPTION }}
            org.opencontainers.image.source=https://github.com/ravabl/gatling-community-mcp
            org.opencontainers.image.url=https://github.com/ravabl/gatling-community-mcp
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Update Docker Hub overview
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_IMAGE }}
          short-description: ${{ env.DOCKERHUB_DESCRIPTION }}
          readme-filepath: .dockerhub/README.md

      - name: Smoke-test published image
        run: |
          python3 scripts/mcp-smoke.py \
            --project-path /workspace \
            -- docker run --rm -i --pull=always \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m \
              --name mcp-gatling-community-release \
              --label "org.opencontainers.image.title=MCP Gatling-community" \
              --mount "type=bind,source=$PWD,target=/workspace,readonly" \
              "${GHCR_IMAGE}:latest"

      - name: Smoke-test published image HTTP daemon and bridge
        run: |
          set -euo pipefail
          network=mcp-gatling-community-release-net
          docker network create "$network"

          docker run --rm -d --pull=always \
            --name mcp-gatling-community-release-http \
            --network "$network" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --label "org.opencontainers.image.title=MCP Gatling-community" \
            --publish 127.0.0.1:8765:8765 \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            "${GHCR_IMAGE}:latest" \
            http --bind 0.0.0.0 --port 8765
          trap 'docker stop mcp-gatling-community-release-http >/dev/null 2>&1 || true; docker network rm "$network" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/healthz

          python3 scripts/mcp-smoke.py \
            --project-path /workspace \
            -- docker run --rm -i --pull=always \
              --network "$network" \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m \
              "${GHCR_IMAGE}:latest" \
              bridge --url http://mcp-gatling-community-release-http:8765/mcp

  dockerhub-retention:
    name: Apply Docker Hub retention
    needs: docker
    uses: ./.github/workflows/dockerhub-retention.yml
    with:
      version: ${{ needs.docker.outputs.version }}
      minor: ${{ needs.docker.outputs.minor }}
      dry_run: false
    secrets: inherit
