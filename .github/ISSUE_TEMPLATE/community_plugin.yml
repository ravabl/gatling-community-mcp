name: Community plugin
description: Request or fix JVM community plugin support.
title: "plugin: "
labels: ["type: plugin"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - Kafka
        - JDBC
        - AMQP
        - Picatinny
        - Other JVM plugin
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: release version or commit
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe checks, correlation, request-reply, or troubleshooting needs.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Link official or verified project documentation.
